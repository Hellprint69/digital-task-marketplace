<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marketplace Akun Digital & Task Board</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen antialiased selection:bg-indigo-500 selection:text-white pb-16">

  <!-- Navbar -->
  <header class="sticky top-0 z-40 backdrop-blur-md bg-slate-900/80 border-b border-slate-800">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 h-16 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center font-bold text-white shadow-lg shadow-indigo-500/20">
          ⚡
        </div>
        <div>
          <span class="font-extrabold text-base tracking-tight text-white block leading-none">TaskHub</span>
          <span class="text-[10px] text-indigo-400 font-semibold uppercase tracking-wider">Digital Marketplace</span>
        </div>
      </div>

      <!-- Role Selector -->
      <div class="flex items-center gap-3">
        <div class="flex items-center bg-slate-800/80 border border-slate-700/70 rounded-lg px-2.5 py-1 text-xs">
          <span class="text-slate-400 mr-2">Login:</span>
          <select id="user-select" class="bg-transparent text-indigo-300 font-semibold focus:outline-none cursor-pointer">
            <optgroup label="Buyer" class="bg-slate-800 text-slate-300">
              <option value="Buyer Andi" class="bg-slate-800 text-white">Buyer Andi</option>
              <option value="Buyer Dimas" class="bg-slate-800 text-white">Buyer Dimas</option>
              <option value="Buyer Jono" class="bg-slate-800 text-white">Buyer Jono</option>
            </optgroup>
            <optgroup label="Seller" class="bg-slate-800 text-slate-300">
              <option value="Seller A" class="bg-slate-800 text-white" selected>Seller A</option>
              <option value="Seller B" class="bg-slate-800 text-white">Seller B</option>
            </optgroup>
          </select>
        </div>

        <button onclick="openModal()" class="bg-gradient-to-r from-indigo-500 to-indigo-600 hover:from-indigo-600 hover:to-indigo-700 text-white text-xs sm:text-sm font-semibold px-3.5 py-2 rounded-lg shadow-md shadow-indigo-500/25 transition active:scale-95 flex items-center gap-1.5">
          <span>+</span> Buat Tugas
        </button>
      </div>
    </div>
  </header>

  <!-- Hero Header -->
  <section class="max-w-5xl mx-auto px-4 sm:px-6 pt-8 pb-6">
    <div class="flex flex-col sm:flex-row justify-between sm:items-end gap-4 border-b border-slate-800 pb-6">
      <div>
        <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">Eksplor Permintaan Akun</h1>
        <p class="text-slate-400 text-sm mt-1">Ambil tugas, kirim detail akun, dan selesaikan pesanan.</p>
      </div>
      <button onclick="fetchTasks()" class="self-start sm:self-auto inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-slate-700 bg-slate-800/50 hover:bg-slate-800 text-xs font-medium text-slate-300 transition">
        <span id="refresh-icon">🔄</span> Segarkan
      </button>
    </div>
  </section>

  <!-- Container List -->
  <main class="max-w-5xl mx-auto px-4 sm:px-6">
    <div id="task-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="col-span-full py-12 text-center text-slate-500 text-sm">Memuat daftar tugas...</div>
    </div>
  </main>

  <!-- Modal 1: Form Buat Tugas (Buyer) -->
  <div id="task-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-sm hidden">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl relative">
      <div class="flex justify-between items-center mb-5">
        <div>
          <h3 class="font-bold text-lg text-white">Posting Permintaan Akun</h3>
          <p class="text-xs text-slate-400 mt-0.5">Tugas akan langsung muncul di papan seller.</p>
        </div>
        <button onclick="closeModal()" class="text-slate-400 hover:text-white text-lg font-bold p-1">✕</button>
      </div>

      <form id="create-task-form" onsubmit="handleCreateTask(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5">Judul Tugas / Akun</label>
          <input type="text" id="task-title" required placeholder="Contoh: Need Akun FB Old 2016 Siap Ads" 
                 class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5">Budget Penawaran (Rp)</label>
          <input type="number" id="task-budget" required min="5000" step="1000" placeholder="50000" 
                 class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5">Rincian Kriteria Akun</label>
          <textarea id="task-desc" rows="3" placeholder="Minimal teman 500, akun buatan indo, 2FA aktif..." 
                    class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500"></textarea>
        </div>

        <div class="pt-2 flex gap-3">
          <button type="button" onclick="closeModal()" class="w-1/2 py-2.5 rounded-xl border border-slate-700 text-slate-300 text-sm font-semibold hover:bg-slate-800 transition">
            Batal
          </button>
          <button type="submit" id="btn-submit-task" class="w-1/2 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold shadow-lg shadow-indigo-600/30 transition">
            Posting Sekarang
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal 2: Form Kirim Detail Akun (Seller) -->
  <div id="submit-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-sm hidden">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl relative">
      <div class="flex justify-between items-center mb-4">
        <div>
          <h3 class="font-bold text-lg text-white">Kirim Detail Akun</h3>
          <p class="text-xs text-slate-400 mt-0.5">Hanya buyer pembuat tugas yang dapat melihat data ini.</p>
        </div>
        <button onclick="closeSubmitModal()" class="text-slate-400 hover:text-white text-lg font-bold p-1">✕</button>
      </div>

      <form id="submit-data-form" onsubmit="handleSubmitAccount(event)" class="space-y-4">
        <input type="hidden" id="submit-task-id">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5">Informasi Akun (Username, Password, 2FA, dll)</label>
          <textarea id="submission-data" required rows="5" placeholder="Username/Email: contoh@mail.com&#10;Password: password123&#10;Kode 2FA / Cadangan: ..." 
                    class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 font-mono"></textarea>
        </div>

        <div class="pt-2 flex gap-3">
          <button type="button" onclick="closeSubmitModal()" class="w-1/2 py-2.5 rounded-xl border border-slate-700 text-slate-300 text-sm font-semibold hover:bg-slate-800 transition">
            Batal
          </button>
          <button type="submit" id="btn-submit-account" class="w-1/2 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-semibold shadow-lg shadow-emerald-600/30 transition">
            Kirim ke Buyer
          </button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
